<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Фонарь</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:auto}</style></head>
<body><canvas id="c"></canvas>
<script>
"use strict";
// ---------- базовые утилиты ----------
const Q=new URLSearchParams(location.search), V=Q.get('v')==='1', LANG=Q.get('lang')||'ru';
const W=V?1080:1920,H=V?1920:1080,D=60,FPS=60,HOR=V?1060:560,M=420,BKS=0.5;
const _c=document.getElementById('c');_c.width=W;_c.height=H;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,t)=>{const u=clamp((t-a)/(b-a));return u*u*(3-2*u)};
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mix=(c1,c2,t)=>[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];
const mul=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
const rgb=(c,a=1)=>`rgba(${Math.max(0,Math.min(255,c[0]))|0},${Math.max(0,Math.min(255,c[1]))|0},${Math.max(0,Math.min(255,c[2]))|0},${a})`;
const bump=(t,t0,d)=>(t<t0||t>t0+d)?0:Math.pow(Math.sin(Math.PI*(t-t0)/d),2);
const decay=(t,t0,tau)=>t<t0?0:Math.exp(-(t-t0)/tau);
function spline(k,t){
  const n=k.length; if(t<=k[0][0])return k[0][1]; if(t>=k[n-1][0])return k[n-1][1];
  let i=0; while(t>k[i+1][0])i++;
  const [t0,v0]=k[i],[t1,v1]=k[i+1], a=i>0?k[i-1]:null, b=i<n-2?k[i+2]:null;
  const m0=a?(v1-a[1])/(t1-a[0]):(v1-v0)/(t1-t0), m1=b?(b[1]-v0)/(b[0]-t0):(v1-v0)/(t1-t0);
  const h=t1-t0,u=(t-t0)/h,u2=u*u,u3=u2*u;
  return (2*u3-3*u2+1)*v0+(u3-2*u2+u)*h*m0+(-2*u3+3*u2)*v1+(u3-u2)*h*m1;
}
const easeOutBack=u=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2)};

// ---------- холсты ----------
const cv=document.getElementById('c'), A=cv.getContext('2d');
const wk=document.createElement('canvas'); wk.width=W; wk.height=H; const g=wk.getContext('2d');
const sn=document.createElement('canvas'); sn.width=W; sn.height=H; const gs=sn.getContext('2d');
const bk=document.createElement('canvas'); bk.width=(W+2*M)*BKS; bk.height=(H+2*M)*BKS; const b=bk.getContext('2d');
const nz=document.createElement('canvas'); nz.width=nz.height=256; {
  const x=nz.getContext('2d'),im=x.createImageData(256,256);
  for(let i=0;i<256*256;i++){const v=rnd(i*3.7)*255;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255}
  x.putImageData(im,0,0);
}

// ---------- события сюжета (синхронны с аудио) ----------
const FLASH=[[12.2,1.0],[13.4,0.6],[16.8,0.9]];
const T_OUT=14.8, T_IGN=46.67, T_SPARK=44.6;
const flash=t=>FLASH.reduce((s,[t0,k])=>s+k*decay(t,t0,0.16),0);
function Lant(t){
  if(t<12.8)return 1;
  if(t<T_OUT){const u=(t-12.8)/(T_OUT-12.8);const base=1-0.75*Math.pow(u,1.4);const f=0.5+0.5*Math.sin(t*47+Math.sin(t*13)*3);return base*(0.35+0.65*f)}
  if(t<T_IGN)return 0.05*Math.exp(-(t-T_OUT)*2.2)+0.12*sm(45.6,T_IGN,t);
  return 1-0.9*Math.exp(-(t-T_IGN)*7);
}
function LampOn(t){
  const bl=Math.max(bump(t,30.0,0.55),bump(t,31.3,0.55),bump(t,32.6,0.55));
  return Math.max(bl*0.9,sm(33.4,35.2,t));
}
const BeamAmt=t=>sm(35.6,37.6,t)*(1-sm(50,54,t));
function state(t){
  const cc=sm(6.5,12,t)*(1-0.85*sm(47,57,t));
  const st=sm(8.5,12.5,t)*(1-0.85*sm(17.5,23,t))*(1-0.7*sm(34,42,t));
  const d=sm(49,58,t);
  return {cc,st,d,fl:flash(t),L:Lant(t),LH:LampOn(t)};
}
function camera(t,S){
  const zoom=spline([[0,1.0],[10,1.14],[13,1.2],[14.6,1.42],[16.5,1.25],[20,1.1],[25,1.02],[29,1.08],[32,1.2],[38,1.1],[44,1.2],[46.7,1.3],[49,1.2],[55,1.0],[60,0.92]],t)
    +0.035*FLASH.reduce((s,[t0,k])=>s+k*decay(t,t0,0.14),0)+0.02*decay(t,T_IGN,0.4);
  const ty=spline([[0,70],[10,-10],[13,-40],[14.6,-5],[17,-45],[20,-20],[24,10],[29,30],[33,-10],[40,0],[44,15],[46.7,20],[50,10],[55,40],[60,60]],t);
  const cx=spline([[0,-120],[10,60],[14,40],[20,-20],[29,-50],[31,40],[34,110],[40,60],[46,100],[50,60],[56,0],[60,-40]],t);
  const roll=(0.8*Math.sin(t*0.5)+S.st*(2.2*Math.sin(t*1.9)+1.0*Math.sin(t*3.7+1))+1.6*bump(t,29,3.2)*Math.sin(Math.PI*(t-29)/3.2))*Math.PI/180
    +0.012*FLASH.reduce((s,[t0,k])=>s+k*decay(t,t0,0.2)*Math.sin((t-t0)*30),0);
  const sx=S.st*(7*Math.sin(t*11.3)+4*Math.sin(t*17.9+2)), sy=S.st*(6*Math.sin(t*9.1+1)+3*Math.sin(t*19.7));
  return {zoom,ty,cx,roll,sx,sy};
}

// ---------- небо / фон (полуразрешение, DOF) ----------
const STARS=Array.from({length:280},(_,i)=>({x:rnd(i*1.3)*(W+2*M)-M,y:-M+Math.pow(rnd(i*2.9),1.4)*(HOR+M-40),r:0.9+rnd(i*5.1)*1.6,p:rnd(i*7.7)*6.28,f:1+rnd(i*9.3)*2}));
const CLOUDS=Array.from({length:20},(_,i)=>({x:rnd(i*4.1)*(W+1400),y:40+rnd(i*6.3)*(HOR-120),r:170+rnd(i*8.7)*260,sp:6+rnd(i*3.3)*18,n:7}));
function drawBack(t,S,C){
  const {cc,st,d,fl}=S;
  b.setTransform(BKS,0,0,BKS,M*BKS,M*BKS);
  const nightTop=[2,5,16],nightMid=[10,20,46],nightHor=[30,56,96];
  const stormK=cc*0.8;
  let top=mix(nightTop,[5,8,10],stormK), mid=mix(nightMid,[14,20,24],stormK), hor=mix(nightHor,[26,34,40],stormK);
  top=mix(top,[46,58,110],d); mid=mix(mid,[170,110,130],d); hor=mix(hor,[255,176,112],d);
  const f=clamp(fl,0,1); top=mix(top,[150,170,210],f*0.55); mid=mix(mid,[190,205,235],f*0.55); hor=mix(hor,[220,230,250],f*0.5);
  const gr=b.createLinearGradient(0,-M,0,HOR);
  gr.addColorStop(0,rgb(top));gr.addColorStop(0.55,rgb(mid));gr.addColorStop(1,rgb(hor));
  b.fillStyle=gr;b.fillRect(-M,-M,W+2*M,HOR+M);
  b.fillStyle=rgb(mul(hor,0.5));b.fillRect(-M,HOR,W+2*M,H+M-HOR+10);
  // звёзды
  const sv=(1-cc)*(1-d);
  if(sv>0.01){
    for(const s of STARS){
      const x=s.x-C.cx*0.12, y=s.y;
      const tw=0.65+0.35*Math.sin(t*s.f+s.p);
      const fade=clamp((HOR-40-y)/260);
      b.fillStyle=`rgba(230,238,255,${sv*tw*fade*0.95})`;
      b.beginPath();b.arc(x,y,s.r*1.5,0,6.283);b.fill();
    }
  }
  // луна
  const mv=(1-cc)*(1-d*0.9), mx=W*0.70-C.cx*0.12, my=(V?340:205)+t*0.8;
  if(mv>0.01){
    let gl=b.createRadialGradient(mx,my,0,mx,my,380);
    gl.addColorStop(0,`rgba(190,210,255,${0.42*mv})`);gl.addColorStop(0.3,`rgba(120,150,220,${0.16*mv})`);gl.addColorStop(1,'rgba(90,120,200,0)');
    b.fillStyle=gl;b.fillRect(mx-380,my-380,760,760);
    b.fillStyle=`rgba(238,243,255,${mv})`;b.beginPath();b.arc(mx,my,V?78:62,0,6.283);b.fill();
    b.fillStyle=`rgba(190,203,228,${0.5*mv})`;
    for(const [dx,dy,r] of [[-18,-14,13],[22,10,17],[-6,28,9],[26,-26,8]]){b.beginPath();b.arc(mx+dx,my+dy,r,0,6.283);b.fill()}
  }
  // рассветное солнце
  if(d>0.12){
    const sx=W*0.28-C.cx*0.2, sy=HOR+60-d*130;
    let gl=b.createRadialGradient(sx,sy,0,sx,sy,520);
    gl.addColorStop(0,`rgba(255,200,130,${0.7*d})`);gl.addColorStop(0.3,`rgba(255,150,100,${0.3*d})`);gl.addColorStop(1,'rgba(255,120,90,0)');
    b.fillStyle=gl;b.fillRect(sx-520,sy-520,1040,1040);
    b.fillStyle=`rgba(255,238,195,${d})`;b.beginPath();b.arc(sx,sy,84,0,6.283);b.fill();
  }
  // облака
  const ca=0.07+0.9*cc;
  for(let i=0;i<CLOUDS.length;i++){
    const c=CLOUDS[i];
    if(i>9&&cc<0.15)continue;
    const x=((c.x+t*c.sp*(0.5+st*2.5))%(W+1400))-700-C.cx*(0.2+0.01*i);
    const y=c.y+cc*60-(i%3)*10;
    const base=mix([14,18,30],[30,34,40],cc), lit=mix(base,[150,170,210],clamp(fl,0,1)*0.85);
    const dawnC=mix(lit,[210,130,120],d*0.7);
    for(let k=0;k<c.n;k++){
      const px=x+(k-3)*c.r*0.42, py=y+Math.sin(k*1.9+i)*c.r*0.16, r=c.r*(0.55+0.4*rnd(i*13+k));
      const gr2=b.createRadialGradient(px,py,0,px,py,r);
      const a=ca*(i>9?0.55:1)*0.9;
      gr2.addColorStop(0,rgb(dawnC,a*0.9));gr2.addColorStop(0.6,rgb(dawnC,a*0.5));gr2.addColorStop(1,rgb(dawnC,0));
      b.fillStyle=gr2;b.fillRect(px-r,py-r,2*r,2*r);
    }
  }
  // молния
  for(let i=0;i<FLASH.length;i++){
    const t0=FLASH[i][0];
    if(i===1||t<t0||t>t0+0.14)continue;
    const bx=[W*0.65,0,W*0.85][i], a=1-(t-t0)/0.14;
    let x=bx,y=-M; const pts=[[x,y]];
    for(let k=1;k<=16;k++){x+=(rnd(i*100+k)-0.5)*90;y=-M+k*(HOR+M)/16;pts.push([x,y])}
    for(const [lw,al] of [[16,0.12],[7,0.3],[2.5,0.95]]){
      b.strokeStyle=`rgba(225,235,255,${al*a})`;b.lineWidth=lw;b.lineJoin='round';
      b.beginPath();pts.forEach(([px,py],k)=>k?b.lineTo(px,py):b.moveTo(px,py));b.stroke();
      const br=pts[7];b.beginPath();b.moveTo(br[0],br[1]);
      let bx2=br[0],by2=br[1];for(let k=1;k<6;k++){bx2+=40+rnd(i*50+k)*30;by2+=60;b.lineTo(bx2,by2)}b.stroke();
    }
  }
}

// ---------- море ----------
const NR=46, SB=0.5;
const rowY=s=>HOR+(H+420-HOR)*Math.pow(s,1.75);
const lamda=s=>16+130*Math.pow(s,1.3);
const amp=(s,rough)=>(1.2+34*Math.pow(s,1.4))*(0.35+0.9*rough);
function wv(x,s,id,t){
  const l=lamda(s);
  return 0.55*Math.sin(x/l+id*1.37+t*(0.8+s))+0.3*Math.sin(x/(l*0.47)+id*2.9-t*1.3*(0.8+s))+0.25*Math.sin(x/(l*1.8)+id*0.6+t*0.5);
}
const travel=t=>30*t+1200*sm(29,47,t);

// ---------- маяк ----------
function lhScale(t){return 0.07+0.93*Math.pow(sm(29,49,t),1.8)}
function lhGeom(t,C){
  const sc=lhScale(t), u=sm(29,49,t);
  const x=lerp(W*0.62,W*0.72,u)-C.cx*0.55;
  const baseY=HOR+40+90*sc;
  return {sc,x,baseY,lampX:x,lampY:baseY-512*sc};
}
function drawLighthouse(t,S,G,lum){
  const {sc,x,baseY}=G, lit=S.LH;
  g.save();g.translate(x,baseY);g.scale(sc,sc);
  const rock=mix([10,14,22],[70,60,70],S.d*0.8), rl=mul(rock,0.6+lum*2.2);
  g.fillStyle=rgb(rl);g.beginPath();
  const pts=[[-440,40],[-420,0],[-330,-40],[-220,-72],[-120,-96],[-70,-106],[70,-106],[140,-90],[260,-62],[360,-30],[440,6],[450,40]];
  pts.forEach(([px,py],i)=>i?g.lineTo(px,py):g.moveTo(px,py));g.fill();
  g.strokeStyle=rgb([255,200,140],0.35*(lit*0.7+S.d)*0.6);g.lineWidth=3;g.beginPath();pts.slice(2,9).forEach(([px,py],i)=>i?g.lineTo(px,py-2):g.moveTo(px,py-2));g.stroke();
  const stripes=5;
  for(let i=0;i<stripes;i++){
    const y0=-106-i*(364/stripes), y1=-106-(i+1)*(364/stripes);
    const w0=lerp(76,46,(i)/stripes), w1=lerp(76,46,(i+1)/stripes);
    const col=i%2?[210,70,60]:[226,226,232];
    const k=0.012+lum*0.8+lit*0.18;
    g.fillStyle=rgb(mul(col,Math.min(1.1,k)));
    g.beginPath();g.moveTo(-w0,y0);g.lineTo(w0,y0);g.lineTo(w1,y1);g.lineTo(-w1,y1);g.fill();
    g.fillStyle=`rgba(0,0,0,${0.28})`;g.beginPath();g.moveTo(w0*0.15,y0);g.lineTo(w0,y0);g.lineTo(w1,y1);g.lineTo(w1*0.15,y1);g.fill();
  }
  g.fillStyle=rgb(mul([30,34,48],0.6+lum*3));g.fillRect(-62,-480,124,13);
  g.fillStyle=rgb(lerp(0,1,lit)>0.02?mix([40,50,70],[255,226,160],clamp(lit)):[40,50,70]);
  g.fillRect(-32,-534,64,52);
  g.fillStyle=rgb(mul([30,34,48],0.6+lum*3));
  g.beginPath();g.moveTo(-42,-534);g.lineTo(0,-580);g.lineTo(42,-534);g.fill();g.fillRect(-3,-596,6,18);
  g.fillStyle='rgba(0,0,0,0.5)';g.fillRect(-1,-534,2,52);
  g.restore();
}

// ---------- лодка ----------
function boatState(t,S,C){
  const rough=0.35+0.9*S.st, st=S.st;
  const sc=V?1.55:1.15;
  const x=W*(V?0.42:0.40)-C.cx*0.9+25*Math.sin(t*0.3)+40*st*Math.sin(t*0.9);
  const yb=rowY(SB)+10+amp(SB,rough)*wv(x,SB,7,t)+st*(40*Math.sin(t*1.1+0.5)+18*Math.sin(t*2.3))+4*Math.sin(t*0.8);
  const ang=0.045*Math.sin(t*0.9)+st*(0.2*Math.sin(t*1.1+1.1)+0.09*Math.sin(t*2.3+1));
  const sw=-ang*0.8+0.12*Math.sin(t*2.0)*(0.5+st*1.5);
  return {x,y:yb,ang,sc,sw};
}
function bpt(B,lx,ly){const c=Math.cos(B.ang),s=Math.sin(B.ang);return [B.x+B.sc*(lx*c-ly*s),B.y+B.sc*(lx*s+ly*c)]}
function lanternLocal(B){return [22+22*Math.sin(B.sw),-246+22*Math.cos(B.sw)]}
function drawBoat(t,S,B,lum,warm){
  g.save();g.translate(B.x,B.y);g.rotate(B.ang);g.scale(B.sc,B.sc);
  const cool=[0.72,0.84,1.0], wm=[1.0,0.84,0.6];
  const tint=mix(cool,wm,clamp(warm));
  const paper=[240,230,210];
  const col=k=>rgb([paper[0]*tint[0]*k*lum,paper[1]*tint[1]*k*lum,paper[2]*tint[2]*k*lum]);
  const bulge=6+12*S.st*Math.sin(t*2.7);
  // тень под корпусом
  g.fillStyle='rgba(0,0,0,0.25)';g.beginPath();g.ellipse(0,30,130,10,0,0,6.283);g.fill();
  // корпус
  g.fillStyle=col(1.0);g.beginPath();g.moveTo(-120,-42);g.lineTo(0,-42);g.lineTo(0,26);g.lineTo(-78,26);g.closePath();g.fill();
  g.fillStyle=col(0.7);g.beginPath();g.moveTo(0,-42);g.lineTo(120,-42);g.lineTo(78,26);g.lineTo(0,26);g.closePath();g.fill();
  g.fillStyle=col(1.12);g.beginPath();g.moveTo(-120,-42);g.lineTo(120,-42);g.lineTo(112,-34);g.lineTo(-112,-34);g.closePath();g.fill();
  g.strokeStyle='rgba(0,0,0,0.25)';g.lineWidth=2;g.beginPath();g.moveTo(0,-42);g.lineTo(0,26);g.stroke();
  // паруса
  g.fillStyle=col(0.8);g.beginPath();g.moveTo(-4,-46);g.lineTo(-4,-170);g.quadraticCurveTo(-60-bulge*0.6,-110,-92,-46);g.closePath();g.fill();
  g.fillStyle=col(0.95);g.beginPath();g.moveTo(-4,-46);g.lineTo(-4,-232);g.quadraticCurveTo(66+bulge,-140,104,-46);g.closePath();g.fill();
  g.strokeStyle='rgba(0,0,0,0.18)';g.lineWidth=2;g.beginPath();g.moveTo(-4,-232);g.quadraticCurveTo(30,-120,40,-46);g.stroke();
  // мачта и стрела
  g.strokeStyle=rgb(mul([90,70,55],0.3+lum*1.5));g.lineWidth=5;g.beginPath();g.moveTo(-4,-44);g.lineTo(-4,-250);g.lineTo(22,-250);g.stroke();
  // фонарь
  const [lx,ly]=lanternLocal(B);
  g.lineWidth=2;g.beginPath();g.moveTo(22,-250);g.lineTo(lx,ly-14);g.stroke();
  g.save();g.translate(lx,ly);g.rotate(B.sw*0.6);
  g.fillStyle='#2a2a32';g.fillRect(-10,-14,20,5);
  g.fillStyle=S.L>0.04?rgb(mix([120,70,40],[255,224,150],clamp(S.L))):'#1a1f2a';g.fillRect(-9,-9,18,22);
  g.fillStyle='#2a2a32';g.fillRect(-10,13,20,4);g.fillRect(-1,-9,2,22);
  g.restore();
  g.restore();
}

// ---------- свет ----------
function glow(x,y,r,col,a){
  if(a<=0.003)return;
  const gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,rgb(col,a));gr.addColorStop(0.25,rgb(col,a*0.45));gr.addColorStop(1,rgb(col,0));
  g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);
}
function streak(x,y,r,col,a,sy){
  if(a<=0.003)return;
  g.save();g.translate(x,y);g.scale(1,sy);glow(0,0,r,col,a);g.restore();
}
function beamDraw(lx,ly,ang,len,a){
  g.save();g.translate(lx,ly);g.rotate(ang);
  for(const [half,al] of [[0.16,0.10],[0.07,0.2],[0.022,0.34]]){
    const gr=g.createLinearGradient(0,0,len,0);
    gr.addColorStop(0,`rgba(255,238,195,${al*a})`);gr.addColorStop(0.5,`rgba(255,228,175,${al*a*0.45})`);gr.addColorStop(1,'rgba(255,220,160,0)');
    g.fillStyle=gr;g.beginPath();g.moveTo(0,-2);g.lineTo(len,-len*Math.tan(half));g.lineTo(len,len*Math.tan(half));g.lineTo(0,2);g.fill();
  }
  g.restore();
}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function beamAngle(t,G,lantern){
  const a0=Math.atan2(lantern[1]-G.lampY,lantern[0]-G.lampX);
  const amp=0.5*(1-sm(41,44,t));
  return a0+amp*Math.sin(0.9*(t-36))+0.45*sm(47,50.5,t);
}

// ---------- текст ----------
const CAPS=[
 {t0:1.2,t1:8.8,lines:["Жила-была","маленькая лодочка."]},
 {t0:10.8,t1:19.2,lines:["Но налетел ветер —","и погасил её фонарь."],warm:{"фонарь.":"lantern"}},
 {t0:21,t1:28.6,lines:["Стало темно","и совсем одиноко."]},
 {t0:30.4,t1:40.8,lines:["Но вдалеке","мигнул огонёк."],warm:{"огонёк.":"lamp"}},
 {t0:41.6,t1:51.6,lines:["Маяк поделился","своим светом."],warm:{"светом.":"ignite"}},
 {t0:53.0,t1:999,lines:["Свет нужен,","чтобы им делиться."],warm:{"Свет":"on","делиться.":"on"},big:true}
];
const CAPS_EN=[
 ["Once there was","a little boat."],
 ["But the wind came","and blew out","her lantern."],
 ["It got dark.","And very lonely."],
 ["But far away,","a tiny light","blinked."],
 ["The lighthouse","shared its light."],
 ["Light is meant","to be shared."]
];
const WARM_EN=[null,{"lantern.":"lantern"},null,{"light":"lamp"},{"light.":"ignite"},{"Light":"on","shared.":"on"}];
if(LANG==='en')CAPS.forEach((c,i)=>{c.lines=CAPS_EN[i];c.warm=WARM_EN[i]||undefined});
let capReady=false;
function layoutCaps(){
  A.save();
  for(const c of CAPS){
    const fs=V?(c.big?84:76):(c.big?92:80); c.fs=fs; A.font=`700 ${fs}px "Inter Display","Inter",sans-serif`;
    c.letters=[];let idx=0;
    c.lines.forEach((ln,li)=>{
      let x=0;
      const words=ln.split(' ');
      words.forEach((w,wi)=>{
        for(const ch of w){const wd=A.measureText(ch).width;c.letters.push({ch,x,li,w,idx:idx++,wd});x+=wd}
        x+=A.measureText(' ').width;
      });
    });
  }
  A.restore();capReady=true;
}
function warmOf(kind,t,S){
  switch(kind){
    case "lantern":return clamp(S.L);
    case "lamp":return clamp(S.LH);
    case "ignite":return sm(T_IGN-0.2,T_IGN+0.5,t);
    case "on":return 1;
  }
  return 0;
}
function drawCaps(t,S){
  if(!capReady)layoutCaps();
  for(const c of CAPS){
    if(t<c.t0-0.1||t>c.t1+2.5)continue;
    A.save();
    A.font=`700 ${c.fs}px "Inter Display","Inter",sans-serif`;A.textBaseline='alphabetic';
    const lh=c.fs*1.22, X0=(V?84:150)+Math.sin(t*0.4)*3, Y0=V?270:(c.big?190:170);
    for(const L of c.letters){
      const tin=c.t0+L.idx*0.032, u=clamp((t-tin)/0.75);
      if(u<=0)continue;
      const te=c.t1+L.idx*0.014, ue=clamp((t-te)/0.55);
      let a=sm(0,0.4,u)*(1-ue);if(a<=0.003)continue;
      const e=easeOutBack(u);
      const y=Y0+L.li*lh+(1-e)*70-ue*46+Math.sin(t*1.5+L.idx*0.45)*2.2;
      const x=X0+L.x+(1-e)*(-10);
      const kind=c.warm&&c.warm[L.w];
      let col=[244,246,255];
      if(kind){
        const wmv=warmOf(kind,t,S);
        const off=kind==="lantern"?[120,130,158]:[244,246,255];
        col=mix(off,[255,203,120],wmv);
        if(wmv>0.2){A.shadowColor=`rgba(255,170,70,${0.55*wmv})`;A.shadowBlur=24}
      }
      if(!A.shadowBlur){A.shadowColor='rgba(0,0,20,0.55)';A.shadowBlur=18}
      A.globalAlpha=a;A.fillStyle=rgb(col);
      A.save();A.translate(x+L.wd/2,y);A.rotate((1-e)*0.12*(L.idx%2?1:-1));A.fillText(L.ch,-L.wd/2,0);A.restore();
      A.shadowBlur=0;
    }
    A.restore();
  }
}

// ---------- сцена ----------
function drawScene(t){
  const S=state(t), C=camera(t,S);
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.fillStyle='#000';g.fillRect(0,0,W,H);
  g.translate(W/2,H/2);g.rotate(C.roll);g.scale(C.zoom,C.zoom);g.translate(-W/2+C.sx,-H/2+C.ty+C.sy);
  const CAM=g.getTransform();
  // фон
  drawBack(t,S,C);
  const blur=lerp(1.1,0.5,S.d)+2.4*bump(t,13.4,4.4)+1.0*bump(t,43,6);
  g.save();g.filter=`blur(${blur.toFixed(2)}px)`;
  g.drawImage(bk,0,0,bk.width,bk.height,-M,-M,W+2*M,H+2*M);g.restore();
  // состояния
  const rough=0.35+0.9*S.st;
  const B=boatState(t,S,C), G=lhGeom(t,C);
  const lanternP=bpt(B,...lanternLocal(B));
  const bang=beamAngle(t,G,lanternP), bAmt=BeamAmt(t);
  const dirToBoat=Math.atan2(lanternP[1]-G.lampY,lanternP[0]-G.lampX);
  const hit=bAmt*Math.exp(-Math.pow(angDiff(bang,dirToBoat)/0.06,2));
  const moonV=(1-S.cc)*(1-S.d*0.9);
  const lumBoat=clamp(0.16+0.30*moonV+0.5*S.d+0.4*S.L+0.9*hit+0.5*clamp(S.fl),0,1.15);
  const warmB=clamp(S.L*0.7+hit*0.9+S.d*0.3);
  const lumLH=clamp(0.04+0.12*moonV+0.35*S.d+0.4*clamp(S.fl),0,0.5);
  const lights=[];
  const mx=W*0.70-C.cx*0.12;
  if(moonV>0.05)lights.push({x:mx,int:moonV*0.55,w:170,col:[200,215,255],minS:0});
  if(S.d>0.15)lights.push({x:W*0.28-C.cx*0.2,int:S.d*0.9,w:220,col:[255,190,120],minS:0});
  if(S.LH>0.05)lights.push({x:G.lampX,int:S.LH*0.75,w:60+120*G.sc,col:[255,214,150],minS:0});
  if(S.L>0.05)lights.push({x:lanternP[0],int:S.L*0.9,w:90,col:[255,190,100],minS:SB-0.02});
  // горизонт-цвет моря
  const dk=1-0.75*S.cc*(1-S.d);
  const horC=mix(mix([34,62,104],[26,34,42],S.cc*0.7),[250,170,120],S.d*0.8);
  const nearC=mix(mix([5,12,30],[3,7,12],S.cc*0.7),[24,60,84],S.d*0.8);
  const horL=mul(mix(horC,[220,235,255],clamp(S.fl)*0.5),dk);
  const off=travel(t)*0.02, fo=off-Math.floor(off), io=Math.floor(off);
  let boatDone=false, isleDone=false;
  const islBase=G.baseY;
  for(let k=0;k<NR;k++){
    const s=(k+fo)/NR, id=io-k, ys=rowY(s);
    if(!isleDone&&ys>=islBase){drawLighthouse(t,S,G,lumLH);isleDone=true;
      // кромка пены у острова
      g.fillStyle=`rgba(200,215,235,${0.25*(0.4+moonV+S.d)})`;g.fillRect(G.x-440*G.sc,islBase-2,880*G.sc,3*Math.max(0.4,G.sc));}
    if(!boatDone&&s>SB){drawBoat(t,S,B,lumBoat,warmB);boatDone=true}
    const A_=amp(s,rough);
    const col0=mix(horL,mul(mix(nearC,[8,20,42],0.3),dk),Math.pow(s,0.5));
    const col=mul(col0,0.94+0.12*rnd(id*3.1));
    const sN=(k+1+fo)/NR, gap=(rowY(Math.min(1.2,sN))-ys)+2*amp(Math.min(1,sN),rough)+10;
    g.fillStyle=rgb(col);
    g.beginPath();
    const x0=-440,x1=W+440,stp=24;
    const tops=[];
    for(let x=x0;x<=x1;x+=stp){const yy=ys+A_*wv(x,s,id,t);tops.push([x,yy])}
    g.moveTo(x0,tops[0][1]);
    for(const [x,y] of tops)g.lineTo(x,y);
    const lastS=(k===NR-1);
    g.lineTo(x1,lastS?H+420:ys+gap);g.lineTo(x0,lastS?H+420:ys+gap);g.closePath();g.fill();
    // гребни
    const crest=mul(col,1.5+0.5*S.st);
    g.strokeStyle=rgb(crest,0.35+0.25*s+0.2*S.st);g.lineWidth=1+2.2*s;
    g.beginPath();tops.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
    if(S.st>0.2&&s>0.3){g.strokeStyle=`rgba(200,220,240,${0.12*S.st*s})`;g.lineWidth=2+3*s;g.stroke()}
    // блики
    g.globalCompositeOperation='lighter';
    for(let li=0;li<lights.length;li++){
      const L=lights[li];
      if(s<L.minS)continue;
      for(let j=0;j<5;j++){
        const r1=rnd(id*31+j*7+li*101), r2=rnd(id*17+j*3+li*57);
        const x=L.x+(r1-0.5)*L.w*(0.25+s*1.3), w=(8+110*s)*(0.4+r2), h=1.2+5*s;
        const y=ys+A_*wv(x,s,id,t)+h;
        const al=L.int*(0.2+0.8*r2)*(0.5+0.5*Math.sin(t*3+id*1.7+j))*(0.25+0.75*s);
        g.fillStyle=rgb(L.col,clamp(al,0,1));g.fillRect(x-w/2,y,w,h);
      }
    }
    g.globalCompositeOperation='source-over';
  }
  if(!boatDone)drawBoat(t,S,B,lumBoat,warmB);
  // дымка на горизонте
  {
    const mc=mix(horL,[255,200,150],S.d*0.4);
    const gr=g.createLinearGradient(0,HOR-130,0,HOR+90);
    gr.addColorStop(0,rgb(mc,0));gr.addColorStop(0.55,rgb(mc,0.20+0.16*S.d));gr.addColorStop(1,rgb(mc,0));
    g.fillStyle=gr;g.fillRect(-M,HOR-130,W+2*M,220);
  }
  // ----- световой проход -----
  g.globalCompositeOperation='lighter';
  // лампа маяка
  if(S.LH>0.02){
    const r=Math.max(26,70*G.sc+30);
    glow(G.lampX,G.lampY,r,[255,226,160],S.LH);
    glow(G.lampX,G.lampY,r*4.5,[255,190,110],0.4*S.LH);
    streak(G.lampX,G.lampY,r*14,[255,214,150],0.5*S.LH,0.035);
  }
  if(bAmt>0.01){
    beamDraw(G.lampX,G.lampY,bang,600+2400*G.sc,bAmt);
    if(hit>0.02){glow(lanternP[0],lanternP[1]-40,280,[255,236,200],0.35*hit);}
  }
  // лунный ореол на море
  // фонарь лодки
  {
    const fl=S.L, [lx,ly]=lanternP, P=decay(t,T_IGN,0.28);
    if(fl>0.01){
      glow(lx,ly,34,[255,236,180],fl);
      glow(lx,ly,170*(0.7+0.3*fl),[255,176,80],0.6*fl);
      glow(lx,ly,440,[255,140,50],0.10*fl);
    }
    if(P>0.01){glow(lx,ly,760,[255,224,170],0.55*P);streak(lx,ly,900,[255,230,180],0.5*P,0.06)}
  }
  // искра
  if(t>T_SPARK&&t<T_IGN+0.02){
    const u0=clamp((t-T_SPARK)/(T_IGN-T_SPARK));
    for(let k=0;k<18;k++){
      const uu=clamp(u0-k*0.014); if(uu<=0)continue;
      const e=uu*uu*(3-2*uu);
      const p0=[G.lampX,G.lampY],p3=lanternP;
      const p1=[p0[0]-300*G.sc-80,p0[1]-120],p2=[p3[0]+260,p3[1]-300];
      const m=1-e;
      const px=m*m*m*p0[0]+3*m*m*e*p1[0]+3*m*e*e*p2[0]+e*e*e*p3[0];
      const py=m*m*m*p0[1]+3*m*m*e*p1[1]+3*m*e*e*p2[1]+e*e*e*p3[1];
      const fade=1-k/18;
      glow(px,py,(k?18:42)*(0.5+fade),[255,226,160],(k?0.55:1)*fade);
    }
  }
  g.globalCompositeOperation='source-over';
  // дым от погасшего фонаря
  if(t>T_OUT&&t<T_OUT+3.5){
    for(let k=0;k<7;k++){
      const age=t-T_OUT-k*0.22; if(age<=0||age>2.6)continue;
      const px=lanternP[0]+(rnd(k*5)-0.3)*40+age*70*(0.3+S.st+0.2)+Math.sin(age*3+k)*8;
      const py=lanternP[1]-age*60;
      const r=14+age*26;
      g.fillStyle=`rgba(150,160,180,${0.20*(1-age/2.6)})`;g.beginPath();g.arc(px,py,r,0,6.283);g.fill();
    }
  }
  // дождь
  if(S.st>0.05){
    g.strokeStyle=`rgba(190,210,235,${0.32*S.st})`;
    for(let i=0;i<520;i++){
      const sp=1700+rnd(i*2.1)*800, len=sp*0.026, sl=0.33;
      const x=((rnd(i*1.7)*(W+900)+t*sp*sl*0.0)- t*sp*sl*0.9)%(W+900);
      const xx=(x+(W+900))%(W+900)-300;
      const y=((rnd(i*3.9)*(H+800)+t*sp)%(H+800))-400;
      g.lineWidth=0.8+rnd(i*5.3)*1.6;
      g.beginPath();g.moveTo(xx,y);g.lineTo(xx-len*sl,y+len);g.stroke();
    }
  }
  // вспышка молнии (экранная)
  if(S.fl>0.02){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(150,170,210,${0.22*clamp(S.fl)})`;g.fillRect(-M,-M,W+2*M,H+2*M);g.globalCompositeOperation='source-over'}
  // радиальный акцент (зум-блюр)
  const rb=0.8*decay(t,T_IGN,0.22)+0.35*decay(t,12.2,0.1)+0.3*decay(t,16.8,0.1);
  if(rb>0.03){
    const q=CAM.transformPoint(new DOMPoint(lanternP[0],lanternP[1]));
    const cxp=t<30?(t>16?(FLASH.length?W*0.6:q.x):q.x):q.x, cyp=q.y;
    g.setTransform(1,0,0,1,0,0);
    gs.setTransform(1,0,0,1,0,0);gs.globalAlpha=1;gs.drawImage(wk,0,0);
    for(let k=1;k<=5;k++){
      const z=1+0.012*k*rb*1.6;
      g.globalAlpha=0.22;
      g.save();g.translate(cxp,cyp);g.scale(z,z);g.translate(-cxp,-cyp);g.drawImage(sn,0,0);g.restore();
    }
    g.globalAlpha=1;
  }
  g.setTransform(1,0,0,1,0,0);
  return S;
}

function nSamples(t){
  if(t>11&&t<20)return 4;
  if(t>29.5&&t<34)return 3;
  if(t>44.4&&t<47.6)return 4;
  return 1;
}
window.renderFrame=function(i,samples){
  const t=i/FPS, n=samples||nSamples(t), shutter=0.75/FPS;
  A.setTransform(1,0,0,1,0,0);A.globalAlpha=1;A.globalCompositeOperation='source-over';
  let S;
  for(let k=0;k<n;k++){
    const tt=Math.min(D,Math.max(0,t+((k+0.5)/n-0.5)*shutter*(n>1?1:0)));
    S=drawScene(tt);
    A.globalAlpha=1/(k+1);A.drawImage(wk,0,0);
  }
  A.globalAlpha=1;
  // виньетка
  const vg=A.createRadialGradient(W/2,H/2,Math.min(W,H)*0.42,W/2,H/2,(V?H*0.62:H));
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  A.fillStyle=vg;A.fillRect(0,0,W,H);
  // зерно (дизеринг против бэндинга)
  A.globalCompositeOperation='overlay';A.globalAlpha=0.07;
  const ox=Math.floor(rnd(i*1.1)*256),oy=Math.floor(rnd(i*2.3)*256);
  const pat=A.createPattern(nz,'repeat');A.save();A.translate(-ox,-oy);A.fillStyle=pat;A.fillRect(0,0,W+256,H+256);A.restore();
  A.globalCompositeOperation='source-over';A.globalAlpha=1;
  // титры
  drawCaps(t,S||state(t));
  // фейды
  const fa=(1-sm(0,1.0,t))+sm(59.2,60,t);
  if(fa>0){A.fillStyle=`rgba(0,0,0,${clamp(fa)})`;A.fillRect(0,0,W,H)}
  return true;
};
window.ready=true;
